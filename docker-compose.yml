services:
  # ============================================
  # PostgreSQL - Test
  # ============================================
  postgres-test:
    image: postgres:16-alpine
    ports:
      - "5433:5432" # Test on port 5433 to avoid conflicts
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TEST_DB}
    volumes:
      - postgres-data-test:/var/lib/postgresql/data
    networks:
      - tamkin-test-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_TEST_USER} -d ${POSTGRES_TEST_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ============================================
  # Backend - Test
  # ============================================
  backend-test:
    build:
      context: ./tamkin-backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${TEST_ENV}
      DATABASE_HOST: postgres-test
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_TEST_USER}
      DATABASE_PASSWORD: ${POSTGRES_TEST_PASSWORD}
      DATABASE_NAME: ${POSTGRES_TEST_DB}
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - tamkin-test-network
      - tamkin-nginx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ============================================
  # Frontend - Test
  # ============================================
  frontend-test:
    build:
      context: ./tamkin-frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${TEST_ENV}
      PORT: ${FRONTEND_PORT}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    depends_on:
      - backend-test
    networks:
      - tamkin-test-network
      - tamkin-nginx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ============================================
  # PostgreSQL - Production
  # ============================================
  postgres-prod:
    image: postgres:16-alpine
    ports:
      - "5432:5432" # Production on standard port
    environment:
      POSTGRES_USER: ${POSTGRES_PROD_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PROD_PASSWORD}
      POSTGRES_DB: ${POSTGRES_PROD_DB}
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    networks:
      - tamkin-prod-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_PROD_USER} -d ${POSTGRES_PROD_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ============================================
  # Backend - Production
  # ============================================
  backend-prod:
    build:
      context: ./tamkin-backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${PROD_ENV}
      DATABASE_HOST: postgres-prod
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_PROD_USER}
      DATABASE_PASSWORD: ${POSTGRES_PROD_PASSWORD}
      DATABASE_NAME:
        ${POSTGRES_PROD_DB}

        # Google OAuth
      GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID_prod}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # JWT Secrets
      SUPER_ADMIN_ACCESS_TOKEN_SECRET: ${SUPER_ADMIN_ACCESS_TOKEN_SECRET}
      SUPER_ADMIN_REFRESH_TOKEN_SECRET: ${SUPER_ADMIN_REFRESH_TOKEN_SECRET}
      ADMIN_ACCESS_TOKEN_SECRET: ${ADMIN_ACCESS_TOKEN_SECRET}
      ADMIN_REFRESH_TOKEN_SECRET: ${ADMIN_REFRESH_TOKEN_SECRET}
      USER_ACCESS_TOKEN_SECRET: ${USER_ACCESS_TOKEN_SECRET}
      USER_REFRESH_TOKEN_SECRET: ${USER_REFRESH_TOKEN_SECRET}

      # Security
      CSRF_SECRET: ${CSRF_SECRET}
      CRYPTO_KEY: ${CRYPTO_KEY}

      # Seed
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SKIP_SEED: ${SKIP_SEED}

      # MinIO
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}

      # Frontend URL
      FRONTEND_URL: https://tamkin-gaza.com # Production URL

      # Payment Gateways (Production - use real keys when ready)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PAYMOB_API_KEY: ${PAYMOB_API_KEY}
      PAYMOB_INTEGRATION_ID: ${PAYMOB_INTEGRATION_ID}
      PAYMOB_IFRAME_ID: ${PAYMOB_IFRAME_ID}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET}
      FAWRY_MERCHANT_CODE: ${FAWRY_MERCHANT_CODE}
      FAWRY_SECRET: ${FAWRY_SECRET}
      FAWRY_URL: ${FAWRY_URL}
      IYZICO_API_KEY: ${IYZICO_API_KEY}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL}
      IYZICO_CALLBACK_URL: ${IYZICO_CALLBACK_URL}

    depends_on:
      postgres-prod:
        condition: service_healthy
    networks:
      - tamkin-prod-network
      - tamkin-nginx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ============================================
  # Frontend - Production
  # ============================================
  frontend-prod:
    build:
      context: ./tamkin-frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${PROD_ENV}
      PORT: ${FRONTEND_PORT}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID_prod}
    depends_on:
      - backend-prod
    networks:
      - tamkin-prod-network
      - tamkin-nginx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ============================================
  # Nginx - Single Instance
  # ============================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend-test
      - backend-test
      - frontend-prod
      - backend-prod
    networks:
      - tamkin-nginx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

networks:
  # Test environment network (isolated)
  tamkin-test-network:
    driver: bridge

  # Production environment network (isolated)
  tamkin-prod-network:
    driver: bridge

  # Shared network for Nginx to access all containers
  tamkin-nginx-network:
    driver: bridge

volumes:
  postgres-data-test:
  postgres-data-prod:
